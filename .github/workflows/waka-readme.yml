name: WakaTime Readme Stats

on:
  schedule:
    # Runs once a day at 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with coding stats
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          # Source: WakaTime (has history). The secret must hold the WakaTime
          # key (waka_...), NOT the Wakapi key. When Wakapi has enough data,
          # switch back by setting the secret to the Wakapi key and adding:
          #   API_BASE_URL: https://wakapi.dev/api/compat/wakatime
          # (No API_BASE_URL here -> defaults to https://wakatime.com/api.)
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TIME_RANGE: all_time
          # Show only the language-mix bars — no hours, no totals, no date line.
          SHOW_TITLE: "false"
          SHOW_TOTAL: "false"
          SHOW_TIME: "false"
          SHOW_MASKED_TIME: "false"
          IGNORED_LANGUAGES: "Text"
          LANG_COUNT: "6"
